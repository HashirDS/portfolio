<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Asher Mehfooz, Data Scientist</title>
  <desc id="desc">Animated Data Scientist badge</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#c4b5fd" />
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="58" fill="#070b14" />
  <circle cx="64" cy="64" r="51" fill="url(#bg)" opacity=".18" />
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#ring)" stroke-width="3">
    <animate attributeName="stroke-dasharray" values="18 284;90 212;18 284" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="64" cy="64" r="35" fill="#0d1424" stroke="#38bdf8" stroke-opacity=".35" />
  <text x="64" y="71" fill="#f0f4ff" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">DS</text>
  <circle cx="104" cy="32" r="5" fill="#34d399">
    <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>
